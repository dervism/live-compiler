name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # same pyright as the Python container (lsp/docker-compose.yml)
      - run: npm i -g pyright@1.1.414
      - run: npm run setup:test && npm i --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
